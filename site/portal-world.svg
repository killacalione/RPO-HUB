<svg class="world-art" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Original pixel-art sunset valley with mountains, a winding river, a small traveler, and a glowing portal" focusable="false" xmlns="http://www.w3.org/2000/svg">
